# ~/.config/hypr/hyprland.conf

# ---- NVIDIA Optimus env vars ----
# Same GPU rendering issue class we hit with Noctalia on niri — these are
# the standard fixes for NVIDIA + wlroots compositors. If Noctalia still
# renders invisibly after this, check ~/.cache/quickshell or run
# `qs -c noctalia-shell` manually in a terminal to see the real error,
# same debugging approach that worked before.
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = WLR_NO_HARDWARE_CURSORS,1

# ---- GTK/Qt theming coherence (Catppuccin Mocha via qt5ct/qt6ct, set up by setup.sh) ----
env = QT_QPA_PLATFORMTHEME,qt5ct

# ---- fcitx5 input method (Korea prep — without these the toggle key changes
# layout but fcitx5-hangul never actually gets input focus in GTK/Qt apps) ----
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx

# ---- Cursor (Bibata-Modern-Ice, installed by setup.sh) ----
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

# ---- Monitor ----
# Hyprland's wildcard auto-picks the panel and its preferred mode/scale, so
# there's nothing to confirm by hand. Only pin an explicit name (from
# `hyprctl monitors`) if you add a second monitor and need a fixed layout.
monitor = ,preferred,auto,1

# ---- Input ----
input {
    # fr (AZERTY) listed first so it's the active layout on login, matching
    # the physical keyboard — previously "us" loaded by default and AZERTY
    # only applied after toggling.
    kb_layout = fr,us,kr
    # Alt+Shift cycles fr -> us -> kr. win_space_toggle used to collide with
    # the Vicinae SUPER+Space bind below — same combo, two different things
    # trying to own it.
    kb_options = grp:alt_shift_toggle
    numlock_by_default = true
    touchpad {
        # Flipped from true: was scrolling the "wrong" way for you. If this
        # is now backwards instead, flip it back to true.
        natural_scroll = false
        tap-to-click = true
    }
}

# ---- Floating by default — this is the whole point of choosing Hyprland ----
# Every window opens floating, draggable/resizable like Windows or KDE.
# Nothing stops you from tiling a specific window later if you ever want to
# (SUPER+V below), this just isn't the default behavior.
windowrulev2 = float, class:.*

# ---- Noctalia's official appearance settings ----
# https://docs.noctalia.dev/v4/getting-started/compositor-settings/hyprland/
general {
    gaps_in = 5
    gaps_out = 10
}

decoration {
    rounding = 20
    rounding_power = 2
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 3
        passes = 2
        vibrancy = 0.1696
    }
}

# Blur the Noctalia bar/panels specifically
layerrule {
    name = noctalia
    match:namespace = noctalia-background-.*$
    ignore_alpha = 0.5
    blur = true
    blur_popups = true
}

# ---- Autostart ----
exec-once = qs -c noctalia-shell
# Vicinae is client/server: this starts the background server so that
# SUPER+SPACE below (a client call) has something to talk to. The bare
# `vicinae` binary alone never started the server, which is why the
# keybind used to do nothing.
exec-once = vicinae server
exec-once = hyprpolkitagent
exec-once = fcitx5 -d
exec-once = wl-paste --watch cliphist store
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

# ---- Noctalia IPC keybinds (confirmed syntax from official docs) ----
$ipc = qs -c noctalia-shell ipc call

bind = SUPER, S, exec, $ipc controlCenter toggle
bind = SUPER, comma, exec, $ipc settings toggle
bind = SUPER, A, exec, $ipc launcher toggle
bind = SUPER, L, exec, $ipc lockScreen lock

bindel = , XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = , XF86AudioLowerVolume, exec, $ipc volume decrease
bindl = , XF86AudioMute, exec, $ipc volume muteOutput
bindel = , XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease

# ---- Vicinae — your primary launcher on SUPER+Space ----
# Confirmed against docs.vicinae.com/quickstart/hyprland: `vicinae toggle`
# is the correct client subcommand, talking to the `vicinae server`
# instance started in exec-once above.
bind = SUPER, SPACE, exec, vicinae toggle

# ---- Window management ----
bind = SUPER, Return, exec, ghostty
bind = SUPER, T, exec, ghostty     # same terminal, second muscle-memory key
bind = SUPER, Q, killactive
bind = SUPER, V, togglefloating   # toggle tiling on/off for the focused window, since default is floating
bind = SUPER, F, fullscreen

# ---- Screenshots / screen recording (Spectacle) ----
bind = , Print, exec, spectacle             # full GUI — pick region/window/screen, or the recorder tab
bind = SUPER, Print, exec, spectacle -r -b -c   # quick region grab straight to clipboard, no GUI

# ---- Media keys (Echoes/MPRIS via playerctl) ----
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4

# Drag/resize with the mouse — the core of the floating experience
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

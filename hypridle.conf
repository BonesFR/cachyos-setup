# ~/.config/hypr/hypridle.conf
# Requires: paru -S hypridle
# Not in setup.sh's must-have list since it's optional — add it if you want
# auto-lock/screen-off on idle rather than only manual SUPER+L.

general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock
    before_sleep_cmd = qs -c noctalia-shell ipc call lockScreen lock
}

listener {
    timeout = 300                                    # 5 min
    on-timeout = qs -c noctalia-shell ipc call lockScreen lock
}

listener {
    timeout = 600                                     # 10 min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
